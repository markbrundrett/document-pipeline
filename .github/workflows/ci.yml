name: CI

# Enforces the constitution's Development Workflow & Quality Gates table:
# coverage >= 80%, SAST clean, dependency scan clean, every commit.
#
# There's no source yet, so each gate is guarded by an explicit detection step:
# the job always runs and reports green, but the gate itself only executes once
# the thing it gates actually exists (Python files, test files, dependency
# manifests). Detection is by tracked-file presence, not by exit-code guessing —
# a job that reports green here means "nothing to check yet", and the moment
# real code lands the gate becomes real with no workflow change needed.
#
# Jobs always run rather than using job-level `if:` so that every check reports
# a genuine success. Skipped jobs interact badly with required status checks if
# branch protection is turned on later.
#
# Assumes Python. If a project built from this template uses a different
# language, replace the "lint" and "test-and-coverage" jobs and the `python`
# detection below — CodeQL and dependency review are language-agnostic.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.check.outputs.python }}
      tests: ${{ steps.check.outputs.tests }}
      manifests: ${{ steps.check.outputs.manifests }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect what exists to gate on
        id: check
        run: |
          if git ls-files '*.py' | grep -q .; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          if git ls-files 'test_*.py' '*_test.py' 'tests/**/*.py' | grep -q .; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests=false" >> "$GITHUB_OUTPUT"
          fi

          if git ls-files 'requirements*.txt' 'pyproject.toml' 'setup.py' \
                          'setup.cfg' 'Pipfile' 'poetry.lock' | grep -q .; then
            echo "manifests=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise
        run: |
          {
            echo "| Gate input | Present |"
            echo "|---|---|"
            echo "| Python files | ${{ steps.check.outputs.python }} |"
            echo "| Test files | ${{ steps.check.outputs.tests }} |"
            echo "| Dependency manifests | ${{ steps.check.outputs.manifests }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.detect.outputs.python == 'true'
      - uses: actions/setup-python@v7
        if: needs.detect.outputs.python == 'true'
        with:
          python-version: "3.12"
      - name: Run ruff
        if: needs.detect.outputs.python == 'true'
        run: |
          pip install ruff --quiet
          ruff check .
      - name: No Python yet
        if: needs.detect.outputs.python != 'true'
        run: echo "No Python files tracked — lint gate not applicable yet."

  test-and-coverage:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.detect.outputs.tests == 'true'
      - uses: actions/setup-python@v7
        if: needs.detect.outputs.tests == 'true'
        with:
          python-version: "3.12"
      - name: Install test dependencies
        if: needs.detect.outputs.tests == 'true'
        run: |
          pip install pytest pytest-cov --quiet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . --quiet || true; fi
      - name: Run tests with coverage gate (>= 80%)
        if: needs.detect.outputs.tests == 'true'
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80
      - name: No tests yet
        if: needs.detect.outputs.tests != 'true'
        run: echo "No test files tracked — coverage gate not applicable yet."

  codeql:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        if: needs.detect.outputs.python == 'true'
      - uses: github/codeql-action/init@v4
        if: needs.detect.outputs.python == 'true'
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        if: needs.detect.outputs.python == 'true'
      - name: No Python yet
        if: needs.detect.outputs.python != 'true'
        run: echo "No Python files tracked — CodeQL has nothing to analyse yet."

  dependency-review:
    needs: detect
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        if: needs.detect.outputs.manifests == 'true'
      - uses: actions/dependency-review-action@v4
        if: needs.detect.outputs.manifests == 'true'
      - name: No dependency manifests yet
        if: needs.detect.outputs.manifests != 'true'
        run: echo "No dependency manifests tracked — nothing for dependency review to compare."
