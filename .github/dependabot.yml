version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

# Add more package-ecosystem entries as this project picks up a stack —
# e.g. "npm" for a frontend, "docker" if you ship containers.
